    <style>
      /* Minor style override for PrismJS to ensure background transparency and proper layout */
      pre[class*="language-"] {
        background: transparent !important;
        margin: 0 !important;
        height: 100%;
      }
      /* Page Transition Animations */
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes fadeOut {
        from { opacity: 1; }
        to { opacity: 0; }
      }
      .page-fade-in {
        animation: fadeIn 0.3s ease-in-out forwards;
      }
      .page-fade-out {
        animation: fadeOut 0.3s ease-in-out forwards;
      }
      
      /* Reader Mode Styles */
      .reader-mode {
        font-family: 'Georgia', serif;
        background-color: #f5f5f5 !important;
        color: #111 !important;
      }
      .reader-mode .reader-hidden, .reader-mode footer, .reader-mode .prose-xl img {
        display: none !important;
      }
      .reader-mode main, .reader-mode h1, .reader-mode h2, .reader-mode p, .reader-mode article {
         background: transparent !important;
         color: #111 !important;
      }
      .reader-mode .prose {
        font-size: 1.25rem;
        line-height: 1.8;
      }
      .reader-mode .max-w-4xl, .reader-mode .max-w-5xl, .reader-mode .max-w-6xl {
        max-width: 800px !important;
      }

      /* Floating animation for application form icons */
      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
        100% { transform: translateY(0px); }
      }
      .icon-float-1 { animation: float 3s ease-in-out infinite; }
      .icon-float-2 { animation: float 3s ease-in-out infinite 0.5s; }
      .icon-float-3 { animation: float 3s ease-in-out infinite 1s; }

      /* Utility to hide scrollbars */
      .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }
      .scrollbar-hide {
        -ms-overflow-style: none;  /* IE and Edge */
        scrollbar-width: none;  /* Firefox */
      }
    </style>

        window.addEventListener('load', () => {
